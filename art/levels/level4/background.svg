<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 740" width="1600" height="740">
  <!--
    Level 4: sunrise. A hazy grey-olive sky turning orange and bright
    yellow toward the horizon, thin lit clouds, a dark forest along the
    horizon and the valley below in the shade. Traced from our own photo;
    its high-rise is left out: the image repeats, so it would stand by
    every runway. The sun itself is not in the
    picture: it would scroll past every few seconds, so the game draws it
    fixed in the sky ahead (and its glare comes from there). The steam
    from the valley's chimneys became an obstacle (houses with steam
    rising from their chimneys), so it is not here.

    The game repeats this image side by side while it scrolls, so the left
    and right edges must match. How that is done here:
      * The plain fills that span the whole width (sky, forest base,
        valley) are drawn once, at the bottom of the file. They only
        change from top to bottom, never from left to right.
      * Everything else lives in the "-art" groups below and is drawn three
        times (x = -1600, 0, +1600). Something that sticks out over one
        edge comes back in at the other edge.
      * The tree lines start and end at the same height at both edges.
      * Bands of morning haze lie over the valley (full width).
    The tree tips and houses were placed by a short seeded script (not
    kept); edit them here by hand.
    scripts/make-backgrounds.sh renders this file and checks the seam.
  -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f6d5e"/>
      <stop offset="0.3" stop-color="#9a7a52"/>
      <stop offset="0.5" stop-color="#d08a3c"/>
      <stop offset="0.63" stop-color="#f0a040"/>
      <stop offset="0.68" stop-color="#f4b456"/>
    </linearGradient>
    <linearGradient id="hazeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e89a4a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e89a4a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e89a4a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="valleyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21140d"/>
      <stop offset="0.5" stop-color="#1a0f09"/>
      <stop offset="1" stop-color="#120a06"/>
    </linearGradient>

    <!-- ===== layers, back to front ===== -->

    <g id="cloud-art">
      <!-- thin clouds lit from below by the rising sun -->
      <ellipse cx="240" cy="330" rx="130" ry="7" fill="#f6b56a" opacity="0.45"/>
      <ellipse cx="270" cy="335" rx="100" ry="4" fill="#8a5a3a" opacity="0.35"/>
      <ellipse cx="820" cy="300" rx="100" ry="7" fill="#f6b56a" opacity="0.45"/>
      <ellipse cx="850" cy="305" rx="77" ry="4" fill="#8a5a3a" opacity="0.35"/>
      <ellipse cx="1180" cy="395" rx="170" ry="7" fill="#f6b56a" opacity="0.45"/>
      <ellipse cx="1210" cy="400" rx="131" ry="4" fill="#8a5a3a" opacity="0.35"/>
      <ellipse cx="560" cy="420" rx="90" ry="7" fill="#f6b56a" opacity="0.45"/>
      <ellipse cx="590" cy="425" rx="69" ry="4" fill="#8a5a3a" opacity="0.35"/>
    </g>
    <g id="far-art">
      <!-- the far forest's tree tips, lit orange at the edge -->
