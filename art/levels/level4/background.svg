  </defs>

  <!-- Each layer: its full-width fill once, then its "-art" three times. -->
  <g id="cloud"><rect width="1600" height="740" fill="url(#skyGrad)"/><use xlink:href="#cloud-art" x="-1600"/><use xlink:href="#cloud-art"/><use xlink:href="#cloud-art" x="1600"/></g>
  <g id="far"><rect y="500" width="1600" height="40" fill="#3a2316"/><use xlink:href="#far-art" x="-1600"/><use xlink:href="#far-art"/><use xlink:href="#far-art" x="1600"/></g>
  <g id="near"><rect y="520" width="1600" height="220" fill="url(#valleyGrad)"/><use xlink:href="#near-art" x="-1600"/><use xlink:href="#near-art"/><use xlink:href="#near-art" x="1600"/></g>
  <g id="house"><use xlink:href="#house-art" x="-1600"/><use xlink:href="#house-art"/><use xlink:href="#house-art" x="1600"/></g>
  <g id="haze"><rect y="520" width="1600" height="90" fill="url(#hazeGrad)"/><rect y="610" width="1600" height="110" fill="url(#hazeGrad)" opacity="0.6"/></g>
</svg>
