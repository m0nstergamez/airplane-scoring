<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 740" width="1600" height="740">
  <!--
    Level 2: sandy beach at sunset, calm bay, dark headlands left and
    right, far islands in between. Traced from our own photo.

    The game repeats this image side by side while it scrolls, so the left
    and right edges must match. How that is done here:
      * The plain fills that span the whole width (sky, water, shore line,
        sand) are drawn once, at the bottom of the file. They only change
        from top to bottom, never from left to right.
      * Everything else lives in the "-art" groups below and is drawn three
        times (x = -1600, 0, +1600). A cloud or headland that sticks out
        over one edge comes back in at the other edge.
      * Never put two things that overlap at the edge (like the far islands
        and the right headland) in the same "-art" group: the next copy
        would paint one over the other. Give each its own group.
    scripts/make-backgrounds.sh renders this file and checks the seam.
  -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56637d"/>
      <stop offset="0.22" stop-color="#6f7890"/>
      <stop offset="0.36" stop-color="#9097a5"/>
      <stop offset="0.45" stop-color="#cacbc4"/>
      <stop offset="0.52" stop-color="#e2dccb"/>
      <stop offset="0.57" stop-color="#e6b585"/>
      <stop offset="0.61" stop-color="#f29d5a"/>
    </linearGradient>
    <!-- wide, flat orange glow above the horizon -->
    <radialGradient id="sunGlow" cx="760" cy="432" r="720" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(760 432) scale(1 0.22) translate(-760 -432)">
      <stop offset="0" stop-color="#ff9a4c" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f7a565" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f7a565" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3aeaa"/>
      <stop offset="0.5" stop-color="#959aa0"/>
      <stop offset="1" stop-color="#7f8790"/>
    </linearGradient>
    <!-- orange reflection of the glow on the water -->
    <radialGradient id="reflection" cx="760" cy="480" r="520" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(760 480) scale(1 0.16) translate(-760 -480)">
      <stop offset="0" stop-color="#ee9c66" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e79a6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#464a53"/>
      <stop offset="0.4" stop-color="#2c3038"/>
      <stop offset="1" stop-color="#202329"/>
    </linearGradient>

    <!-- ===== layers, back to front ===== -->

    <g id="glow-art">
      <rect x="0" y="250" width="1520" height="200" fill="url(#sunGlow)"/>
    </g>

    <g id="sky-art">
      <!-- heavy blue-grey cloud cover at the top -->
      <g fill="#4d586f" opacity="0.6">
        <path d="M0 0 H1600 V60 C1480 90 1380 70 1260 92 C1150 112 1040 84 930 104 C820 124 700 96 580 110 C460 124 340 92 220 104 C120 114 50 84 0 60 Z"/>
        <path d="M260 150 C340 126 470 120 560 138 C620 150 660 168 640 182 C560 196 420 192 320 180 C270 174 230 162 260 150 Z"/>
        <path d="M1060 170 C1140 146 1260 144 1340 160 C1390 170 1400 186 1360 194 C1280 206 1150 200 1080 190 C1040 184 1030 176 1060 170 Z"/>
        <path d="M1430 120 C1500 104 1600 102 1700 118 C1740 126 1730 140 1690 146 C1610 156 1500 152 1450 142 C1410 134 1404 126 1430 120 Z"/>
      </g>
      <!-- pale, lit cloud edges in the bright band -->
      <g fill="#eeebdf" opacity="0.65">
        <path d="M60 236 C160 220 300 222 380 234 C300 246 160 248 60 236 Z"/>
        <path d="M700 214 C820 198 980 200 1080 214 C980 228 820 228 700 214 Z"/>
        <path d="M1280 246 C1380 232 1500 234 1580 246 C1500 258 1380 258 1280 246 Z"/>
      </g>
      <!-- broken dark clouds in the middle -->
      <g fill="#3e4558" opacity="0.75">
        <path d="M170 262 C210 248 260 244 300 252 C330 240 380 236 410 248 C380 262 330 270 280 270 C240 272 190 272 170 262 Z"/>
        <path d="M60 296 C120 282 220 280 300 288 C250 300 150 304 60 296 Z"/>
        <path d="M600 250 C640 236 700 232 740 242 C770 230 830 228 860 240 C900 232 960 236 990 250 C1020 262 1000 276 960 284 C900 292 840 288 790 280 C740 286 680 284 640 274 C610 268 590 260 600 250 Z"/>
        <path d="M1000 286 C1060 276 1140 278 1190 288 C1140 298 1060 298 1000 286 Z"/>
        <path d="M1240 300 C1300 290 1400 290 1460 300 C1400 310 1300 310 1240 300 Z"/>
      </g>
      <!-- long dark bands near the horizon, glow showing between them -->
      <g fill="#474d5d" opacity="0.8">
        <path d="M-120 324 C0 316 140 316 240 322 C160 330 20 332 -120 324 Z"/>
        <path d="M800 332 C960 320 1180 320 1340 330 C1440 324 1560 324 1660 332 C1560 342 1400 344 1300 340 C1140 346 940 344 800 332 Z"/>
        <path d="M-60 362 C80 350 260 350 360 358 C260 368 80 372 -60 362 Z"/>
        <path d="M560 344 C640 338 720 338 780 344 C720 350 640 350 560 344 Z"/>
        <path d="M1100 366 C1240 356 1440 356 1560 362 C1440 372 1240 374 1100 366 Z"/>
        <path d="M-40 392 C120 384 280 388 360 398 C280 406 120 406 -40 392 Z"/>
        <path d="M380 412 C560 404 820 404 1000 410 C1140 406 1300 406 1420 412 C1300 420 1140 420 1000 418 C820 422 560 422 380 412 Z"/>
      </g>
      <!-- bright orange streaks between the bands -->
      <g fill="#ffa65c" opacity="0.7">
        <path d="M300 384 C420 376 560 376 640 382 C560 390 420 390 300 384 Z"/>
        <path d="M720 398 C860 390 1040 390 1160 396 C1040 404 860 404 720 398 Z"/>
        <path d="M1260 392 C1360 386 1500 386 1580 390 C1500 398 1360 398 1260 392 Z"/>
      </g>
    </g>

    <g id="far-art">
      <!-- far islands in the middle, hazy blue-grey; flat bottoms at y = 452 -->
      <path d="M660 452 C672 446 684 438 698 436 C712 434 726 440 740 444 C800 444 880 442 960 445 C1000 443 1040 444 1080 448 L1090 452 Z" fill="#555a66"/>
      <path d="M1120 452 C1140 448 1180 447 1220 449 L1230 452 Z" fill="#606572"/>
    </g>

    <g id="left-art">
      <!-- left headland with a few lights, two rocks off its tip -->
      <path d="M-40 452 C-20 432 20 420 60 422 C120 424 180 432 240 440 C290 446 330 448 360 452 Z" fill="#25292e"/>
      <path d="M380 452 C388 446 402 444 416 446 C424 448 430 450 434 452 Z" fill="#2b2f35"/>
      <path d="M470 452 C474 449 482 448 490 450 L492 452 Z" fill="#2b2f35"/>
      <g fill="#f0a75a" opacity="0.85">
        <circle cx="14" cy="446" r="1.6"/><circle cx="26" cy="448" r="1.4"/><circle cx="96" cy="444" r="1.2"/>
      </g>
    </g>

    <g id="right-art">
      <!-- right headland: a big dark hill that runs over the right edge -->
      <path d="M1180 452 C1200 444 1230 440 1270 440 C1300 434 1330 430 1360 432 C1400 424 1440 412 1490 408 C1530 406 1560 412 1590 420 C1610 418 1640 418 1660 424 C1680 432 1690 444 1700 452 Z" fill="#2c3037"/>
    </g>

    <g id="water-art">
      <!-- the glow's reflection; fades out well before the edges -->
      <rect x="200" y="452" width="1120" height="106" fill="url(#reflection)"/>
      <!-- shimmer lines -->
      <g fill="#cfc8c0" opacity="0.35">
        <rect x="80" y="470" width="220" height="1.5"/><rect x="420" y="476" width="300" height="1.5"/>
        <rect x="860" y="468" width="260" height="1.5"/><rect x="1260" y="480" width="240" height="1.5"/>
        <rect x="200" y="500" width="340" height="2"/><rect x="640" y="494" width="380" height="2"/>
        <rect x="1100" y="506" width="320" height="2"/><rect x="40" y="526" width="300" height="2"/>
        <rect x="520" y="532" width="420" height="2"/><rect x="1060" y="538" width="360" height="2"/>
      </g>
      <!-- tiny buoys -->
      <circle cx="580" cy="458" r="1.5" fill="#2f333a"/><circle cx="1330" cy="460" r="1.5" fill="#2f333a"/>
    </g>

    <g id="sand-art">
      <!-- seaweed drifts along the waterline -->
      <g fill="#1d2025" opacity="0.6">
        <path d="M120 584 C180 576 280 576 340 584 C280 592 180 592 120 584 Z"/>
        <path d="M560 590 C640 580 760 580 840 590 C760 600 640 600 560 590 Z"/>
        <path d="M1180 586 C1240 578 1340 578 1400 586 C1340 594 1240 594 1180 586 Z"/>
      </g>
      <!-- footprints and ripples in the sand -->
      <g fill="#474b55" opacity="0.45">
        <ellipse cx="90" cy="620" rx="22" ry="4"/><ellipse cx="260" cy="650" rx="30" ry="5"/>
        <ellipse cx="430" cy="616" rx="18" ry="3"/><ellipse cx="620" cy="660" rx="34" ry="5"/>
        <ellipse cx="800" cy="628" rx="24" ry="4"/><ellipse cx="980" cy="680" rx="40" ry="6"/>
        <ellipse cx="1130" cy="630" rx="20" ry="3"/><ellipse cx="1300" cy="664" rx="32" ry="5"/>
        <ellipse cx="1500" cy="622" rx="22" ry="4"/><ellipse cx="160" cy="710" rx="44" ry="7"/>
        <ellipse cx="1440" cy="716" rx="46" ry="7"/>
      </g>
      <!-- dark patches of dried seaweed further up the beach -->
      <g fill="#181a1e" opacity="0.55">
        <ellipse cx="380" cy="704" rx="120" ry="18"/>
        <ellipse cx="1060" cy="722" rx="150" ry="16"/>
        <ellipse cx="1580" cy="694" rx="90" ry="14"/>
      </g>
      <!-- driftwood sticks -->
      <g stroke="#5a5550" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <path d="M700 700 l38 -6"/><path d="M1240 690 l-30 -8"/><path d="M220 676 l26 4"/>
      </g>
    </g>
  </defs>

  <!-- Each layer: its full-width fill once, then its "-art" three times. -->
  <g id="sky"><rect width="1600" height="740" fill="url(#skyGrad)"/><use xlink:href="#glow-art" x="-1600"/><use xlink:href="#glow-art"/><use xlink:href="#glow-art" x="1600"/>
    <use xlink:href="#sky-art" x="-1600"/><use xlink:href="#sky-art"/><use xlink:href="#sky-art" x="1600"/></g>
  <g id="far"><use xlink:href="#far-art" x="-1600"/><use xlink:href="#far-art"/><use xlink:href="#far-art" x="1600"/></g>
  <g id="left"><use xlink:href="#left-art" x="-1600"/><use xlink:href="#left-art"/><use xlink:href="#left-art" x="1600"/></g>
  <g id="right"><use xlink:href="#right-art" x="-1600"/><use xlink:href="#right-art"/><use xlink:href="#right-art" x="1600"/></g>
  <g id="water"><rect y="452" width="1600" height="106" fill="url(#waterGrad)"/>
    <use xlink:href="#water-art" x="-1600"/><use xlink:href="#water-art"/><use xlink:href="#water-art" x="1600"/></g>
  <g id="shore"><rect y="554" width="1600" height="3" fill="#b9b3ad" opacity="0.5"/><rect y="557" width="1600" height="5" fill="#33363d"/></g>
  <g id="sand"><rect y="562" width="1600" height="178" fill="url(#sandGrad)"/><use xlink:href="#sand-art" x="-1600"/><use xlink:href="#sand-art"/><use xlink:href="#sand-art" x="1600"/></g>
</svg>
