[workspace]
resolver = "2"
members = ["crates/core", "crates/game", "crates/server"]
# `cargo run` stays the game; the leaderboard is `cargo run -p airplane-scoring-server`.
default-members = ["crates/core", "crates/game"]

[workspace.package]
edition = "2021"
version = "0.2.0"

[workspace.dependencies]
# Engine version is pinned exactly. Change it here and in AGENT.md together.
macroquad = { version = "=0.4.16", features = ["audio"] }

[profile.release]
opt-level = "s"   # smaller wasm
lto = true
codegen-units = 1
