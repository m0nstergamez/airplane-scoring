    </g>
    <g id="house-art">
      <!-- roofs in the valley, a few windows lit -->
      <rect x="380" y="573" width="46" height="16" fill="#1a100a" opacity="0.8"/>
      <rect x="394" y="579" width="4" height="3" fill="#ffb25a" opacity="0.7"/>
      <rect x="618" y="679" width="62" height="23" fill="#1a100a" opacity="0.8"/>
      <rect x="637" y="687" width="4" height="3" fill="#ffb25a" opacity="0.7"/>
      <rect x="813" y="596" width="37" height="15" fill="#1a100a" opacity="0.8"/>
      <rect x="824" y="601" width="4" height="3" fill="#ffb25a" opacity="0.7"/>
      <rect x="1376" y="668" width="62" height="24" fill="#1a100a" opacity="0.8"/>
      <rect x="1394" y="676" width="4" height="3" fill="#ffb25a" opacity="0.7"/>
      <rect x="486" y="642" width="59" height="24" fill="#1a100a" opacity="0.8"/>
      <rect x="165" y="639" width="57" height="20" fill="#1a100a" opacity="0.8"/>
      <rect x="182" y="646" width="4" height="3" fill="#ffb25a" opacity="0.7"/>
      <rect x="722" y="572" width="67" height="24" fill="#1a100a" opacity="0.8"/>
      <rect x="472" y="678" width="53" height="25" fill="#1a100a" opacity="0.8"/>
      <rect x="772" y="614" width="54" height="19" fill="#1a100a" opacity="0.8"/>
      <rect x="788" y="621" width="4" height="3" fill="#ffb25a" opacity="0.7"/>
      <rect x="479" y="666" width="32" height="15" fill="#1a100a" opacity="0.8"/>
      <rect x="444" y="630" width="49" height="18" fill="#1a100a" opacity="0.8"/>
      <rect x="322" y="614" width="38" height="22" fill="#1a100a" opacity="0.8"/>
      <rect x="333" y="621" width="4" height="3" fill="#ffb25a" opacity="0.7"/>
      <rect x="552" y="657" width="43" height="21" fill="#1a100a" opacity="0.8"/>
      <rect x="185" y="568" width="39" height="23" fill="#1a100a" opacity="0.8"/>
      <rect x="382" y="603" width="37" height="20" fill="#1a100a" opacity="0.8"/>
      <rect x="393" y="610" width="4" height="3" fill="#ffb25a" opacity="0.7"/>
      <rect x="1044" y="676" width="68" height="23" fill="#1a100a" opacity="0.8"/>
