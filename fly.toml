# The leaderboard server on Fly.io (image: Dockerfile).
#
# CI deploys it (.github/workflows/pages.yml) on every merge to main
# that touches the server, after the stage passed, and points the
# published page at https://airplane-scoring-board.fly.dev. Set up once
# (done; the manual, Developing, Leaderboard):
#   fly apps create airplane-scoring-board
#   fly volumes create leaderboard_data --size 1 --region fra
#   fly tokens create deploy -a airplane-scoring-board -x 8760h | gh secret set FLY_API_TOKEN
# By hand: fly deploy --ha=false
#
# One Machine only: the database is a file on its volume. Do not scale out.

app = "airplane-scoring-board"
primary_region = "fra"         # Frankfurt; the volume must be in the same region

[env]
  PORT = "8080"
  DB_PATH = "/data/leaderboard.sqlite"
  # The pages that may call the server (comma separated, no trailing slash).
  ALLOWED_ORIGINS = "https://m0nstergamez.github.io"

[[mounts]]
  source = "leaderboard_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when nobody plays (compute is billed only while it runs) and
  # wakes on the next request: the page asks for seeds as it loads.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
