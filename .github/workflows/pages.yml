# Checks every PR; on main it also publishes web/ to GitHub Pages.
name: build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # PR runs replace older ones; deploys on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test -p airplane-scoring-core
      - name: Page script tests (web/board.js)
        run: node --test tests/web/*.test.mjs
      - name: Leaderboard server tests
        run: cargo test -p airplane-scoring-server
      - name: wasm and native fly the same
        run: scripts/check-determinism.sh
      - name: Manual in sync (de/en)
        run: scripts/check-docs.sh
      - name: Diagrams render (Mermaid)
        run: scripts/check-mermaid.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p airplane-scoring -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p airplane-scoring --features autopilot -- -D warnings
      - name: Build web
        run: scripts/build-web.sh
      - name: Stamp the build (installed apps notice updates)
        run: scripts/stamp-build.sh "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
