<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Mobile-first: no zoom, draw under the notch (viewport-fit=cover). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>airplane scoring</title>
  <meta name="theme-color" content="#14181f">
  <!-- "Add to Home Screen" opens full screen (iOS Safari has no fullscreen API for pages). -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Airplane">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; background: #14181f; overflow: hidden;
      position: fixed; inset: 0;           /* no rubber-band scrolling on iOS */
      overscroll-behavior: none;            /* no pull-to-refresh on Android */
      touch-action: none;                   /* no pan, pinch or double-tap zoom */
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;          /* no long-press menu */
      -webkit-tap-highlight-color: transparent;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }

    /* Landscape game: on phones held upright, ask to rotate. */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10;
      background: #14181f; color: #fff;
      font: 600 20px/1.4 system-ui, sans-serif; text-align: center;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    }
    #rotate svg { width: 72px; height: 72px; animation: turn 2s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }

    /* Start screen. Phones: "Tap to fly"; the tap is the user gesture iOS
       needs before it grants motion sensors. Computers: "Click to fly",
       the controls, and a QR code to play on a phone. Either way the tap,
       click or key is the gesture every browser needs before a page may
       play sound (the audio unlock script below resumes audio on it). */
    #start {
      display: flex; position: fixed; inset: 0; z-index: 9;
      background: rgba(20, 24, 31, 0.82); color: #fff;
      font: 600 18px/1.4 system-ui, sans-serif; text-align: center;
      align-items: center; justify-content: center; gap: 56px;
      padding: 24px; box-sizing: border-box;
    }
    #start.gone { display: none; }
    #start .intro { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #start button {
      font: 700 22px system-ui, sans-serif; color: #fff; background: #1f6feb;
      border: 0; border-radius: 999px; padding: 14px 40px; cursor: pointer;
    }
    #start small { font-weight: 400; opacity: 0.75; max-width: 30em; }
    #start .keys { margin: 4px 0 0; padding: 0; list-style: none; font-weight: 400; line-height: 2; }
    #start kbd {
      display: inline-block; min-width: 1.4em; padding: 0 6px; margin: 0 1px;
      border: 1px solid rgba(255, 255, 255, 0.35); border-bottom-width: 3px; border-radius: 6px;
      font: 600 15px/1.5 system-ui, sans-serif;
    }
    #start figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    /* QR on a white card with a quiet zone, so cameras find it. */
    #start figure img {
      width: 164px; height: 164px; padding: 14px; background: #fff; border-radius: 12px;
      image-rendering: pixelated;
    }
    #start figcaption { font-weight: 400; font-size: 16px; }
    #start .url { display: block; opacity: 0.7; font-size: 14px; }
    /* Phone or computer: show only the matching texts. Both show the QR
       code: on a computer to open the game on your phone, on a phone so
       friends can scan it. Phones in landscape are low, so it is smaller. */
    #start .phone { display: none; }
    @media (pointer: coarse) {
      #start { gap: 32px; padding: 12px calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left)); }
      #start .phone { display: block; }
      #start .computer { display: none; }
      #start .intro small { max-width: 20em; }
      #start figure { gap: 8px; }
      #start figure img { width: 112px; height: 112px; padding: 10px; }
      #start figcaption { font-size: 14px; }
      #start .url { font-size: 12px; }
    }

    /* Sound on/off, top right, clear of the notch. Big enough for a thumb. */
    #mute {
      position: fixed; z-index: 8;
      top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
      width: 44px; height: 44px; padding: 10px; border: 0; border-radius: 50%;
      background: rgba(255, 255, 255, 0.1); color: #fff;
    }
    #mute svg { width: 100%; height: 100%; display: block; }
    #mute .off, #mute[aria-pressed="true"] .on { display: none; }
    #mute[aria-pressed="true"] .off { display: inline; }
    #mute[aria-pressed="true"] { color: #9aa4b2; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/>
      <path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/>
      <path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>
  <div id="rotate" role="alert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18.5" x2="13" y2="18.5"/>
    </svg>
    <div>Turn your phone sideways<br>to fly</div>
  </div>
  <div id="start">
    <div class="intro">
      <button type="button"><span class="phone">Tap to fly</span><span class="computer">Click to fly</span></button>
      <small class="phone">Hold your phone like a steering wheel and turn it to climb or dive.<br>Or drag your finger.</small>
      <ul class="keys computer">
        <li><kbd>&uarr;</kbd><kbd>&darr;</kbd> or <kbd>W</kbd><kbd>S</kbd> climb and dive</li>
        <li>Hold the mouse button: fly to the pointer</li>
        <li><kbd>M</kbd> sound on or off</li>
      </ul>
      <small class="computer">Start with a click or <kbd>Enter</kbd></small>
    </div>
    <figure>
      <img src="qr.svg" alt="QR code for m0nstergamez.github.io/airplane-scoring">
      <figcaption><span class="computer">Fly on your phone:<br>scan with the camera</span><span class="phone">Friends scan this<br>to fly too</span><span class="url">m0nstergamez.github.io/airplane-scoring</span></figcaption>
    </figure>
  </div>
  <script>
    // Audio unlock for iOS. Must run before mq_js_bundle.js.
    // The bundle's own unlock resumes its AudioContext on the *first*
    // touchstart/touchend/mousedown/keydown and then stops listening. On a
    // phone that first event is touchstart, which Safari does not count as
    // a user gesture (only touchend and click do), so the resume is refused
    // and the game stays silent on iPhones. Fix without patching the pinned
    // bundle: remember every AudioContext it creates and resume them on
    // each touchend, click and keydown. Listening for good also brings the
    // sound back after iOS interrupts it (a call, switching apps).
    (() => {
      const Native = window.AudioContext || window.webkitAudioContext;
      if (!Native) return;
      const contexts = [];
      class Remembered extends Native {
        constructor(...args) { super(...args); contexts.push(this); }
      }
      window.AudioContext = Remembered;
      if (window.webkitAudioContext) window.webkitAudioContext = Remembered;
      const resume = () => {
        for (const c of contexts) if (c.state !== "running" && c.state !== "closed") c.resume().catch(() => {});
      };
      for (const type of ["touchend", "click", "keydown"]) {
        document.addEventListener(type, resume, { capture: true, passive: true });
      }
    })();
  </script>
  <!-- macroquad/miniquad JS glue. Vendored by scripts/vendor-js.sh; pinned to the engine version. -->
  <script src="mq_js_bundle.js"></script>
  <script>
    // Tilt plugin: keeps the latest gravity sample for the Rust side
    // (crates/game/src/tilt_js.rs). Steering maths lives in core (Tilt).
    const tilt = { has: 0, gx: 0, gy: 0, epoch: 0 };
    addEventListener("devicemotion", (e) => {
      const g = e.accelerationIncludingGravity;
      if (g && g.x != null && g.y != null) { tilt.gx = g.x; tilt.gy = g.y; tilt.has = 1; }
    });
    // New epoch = recalibrate neutral (the phone was turned around).
    const recalibrate = () => { tilt.epoch++; };
    if (screen.orientation) screen.orientation.addEventListener("change", recalibrate);
    else addEventListener("orientationchange", recalibrate);

    miniquad_add_plugin({
      name: "tilt",
      version: 1, // must match tilt_crate_version() in tilt_js.rs
      register_plugin: (importObject) => {
        importObject.env.tilt_has_sample = () => tilt.has;
        importObject.env.tilt_gx = () => tilt.gx;
        importObject.env.tilt_gy = () => tilt.gy;
        importObject.env.tilt_epoch = () => tilt.epoch;
      },
    });

    // Sound plugin: the page owns "sound on/off" (button top right, or the
    // M key via the Rust side) and remembers it. The Rust side
    // (crates/game/src/sound_js.rs) asks every frame.
    const MUTE_KEY = "airplane-scoring.muted";
    const mute = document.getElementById("mute");
    let muted = false;
    try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (_) { /* private mode: not remembered */ }
    const showMuted = () => {
      mute.setAttribute("aria-pressed", String(muted));
      mute.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
    };
    const toggleMute = () => {
      muted = !muted;
      try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (_) { /* see above */ }
      showMuted();
    };
    showMuted();
    mute.addEventListener("click", () => {
      toggleMute();
      document.getElementById("glcanvas").focus(); // keys keep steering
    });

    miniquad_add_plugin({
      name: "sound",
      version: 1, // must match sound_crate_version() in sound_js.rs
      register_plugin: (importObject) => {
        importObject.env.sound_muted = () => (muted ? 1 : 0);
        importObject.env.sound_toggle_mute = toggleMute;
      },
    });

    // Level plugin: "?level=2" starts the flight in level 2 (testing,
    // screenshots). The Rust side (crates/game/src/level_js.rs) asks once;
    // core turns anything invalid into level 1.
    const requestedLevel = parseInt(new URLSearchParams(location.search).get("level"), 10) || 1;
    miniquad_add_plugin({
      name: "level",
      version: 1, // must match level_crate_version() in level_js.rs
      register_plugin: (importObject) => {
        importObject.env.level_requested = () => requestedLevel;
      },
    });

    // Start screen. iOS only hands out motion data after a permission
    // prompt triggered by a tap; Android needs no prompt (HTTPS only, both).
    // Computers have no tilt, so they skip the prompt (Safari on a Mac
    // would show it). "?play" skips the start screen (scripts/shot.sh).
    const start = document.getElementById("start");
    const isPhone = matchMedia("(pointer: coarse)").matches;
    const fly = async () => {
      if (start.classList.contains("gone")) return;
      start.classList.add("gone");
      const ask = isPhone && window.DeviceMotionEvent && DeviceMotionEvent.requestPermission;
      if (ask) {
        try { await DeviceMotionEvent.requestPermission(); } catch (_) { /* denied: drag still works */ }
      }
      recalibrate(); // neutral = how the player holds the phone right now
      document.getElementById("glcanvas").focus();
    };
    start.querySelector("button").addEventListener("click", fly);
    addEventListener("keydown", (e) => {
      const waiting = !start.classList.contains("gone");
      if (waiting && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); fly(); }
    });
    if (new URLSearchParams(location.search).has("play")) start.classList.add("gone");
  </script>
  <script>load("airplane-scoring.wasm");</script>
  <script>
    // Dev live reload: on localhost only, reload when a new .wasm is built
    // (scripts/watch.sh / scripts/dev.sh). Harmless anywhere else.
    if (["localhost", "127.0.0.1"].includes(location.hostname)) {
      let seen = null;
      setInterval(async () => {
        try {
          const r = await fetch("airplane-scoring.wasm", { method: "HEAD", cache: "no-store" });
          const v = r.headers.get("Last-Modified");
          if (seen && v && v !== seen) location.reload();
          seen = v || seen;
        } catch (_) { /* server restarting; try again */ }
      }, 1000);
    }
  </script>
</body>
</html>
