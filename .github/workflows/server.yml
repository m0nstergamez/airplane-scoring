# The leaderboard server: the stage on every PR that touches it, and on
# main the deploy to Fly.io once the stage passed.
#
# The stage is scripts/stage.sh with STAGE_HOST=docker: the server's real
# image (Dockerfile, amd64 Linux like Fly's machines) on this runner, the
# web build pointing at it, then
#   e2e          the API end to end, with a replay flown by core as wasm
#   e2e-browser  the real page in headless Chrome, level 1 flown by the
#                test-only autopilot, until it shows a world rank
name: leaderboard server

on:
  push:
    branches: [main]
    paths: &paths
      - crates/core/**
      - crates/server/**
      - crates/game/src/board.rs
      - crates/game/src/autopilot.rs
      - web/board.js
      - web/index.html
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - Dockerfile
      - .dockerignore
      - fly.toml
      - scripts/stage.sh
      - scripts/set-board-api.sh
      - scripts/cdp_shot.py
      - .github/workflows/server.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGE_HOST: docker
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Stage up (server image, web build)
        run: scripts/stage.sh up
      - name: API end to end
        run: scripts/stage.sh e2e
      - name: Browser end to end (autopilot flies level 1)
        run: scripts/stage.sh e2e-browser
      - name: Server log
        if: failure()
        run: docker logs stage-board
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage-autopilot
          path: target/shots/stage-autopilot.png
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time, and none cancelled halfway.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    environment:
      name: fly
      url: https://airplane-scoring-board.fly.dev/health
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: The server answers
        run: |
          for _ in $(seq 1 30); do
            curl -fsS https://airplane-scoring-board.fly.dev/health && exit 0
            sleep 2
          done
          echo "the deployed server does not answer /health" >&2
          exit 1
